name: pr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests and meta-tests (no VIO, no dataset)
        run: pytest -m "not sequence and not slow" --junitxml=junit-unit.xml
      - name: Gate logic on committed golden results
        env:
          HARNESS_RESULTS: tests/golden_results
          HARNESS_REQUIRE_RESULTS: "1"
        run: pytest -m sequence --junitxml=junit-gate.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit-*.xml
