name: nightly-vio
# Manual only (S5a). A schedule is added in a later session, after a green manual run.
# Builds the pinned OpenVINS image, runs the requested sequence(s) RUNS times, scores them
# and judges them with the gate (src/vioreg/gate.py, docs/gate.md). Expected verdict while
# the image is rebuilt here: "needs re-baseline" (a rebuilt image has a new image_digest);
# the job summary still compares poses and the RPE ratio with the baseline, labelled
# informational. The EuRoC dataset is fetched per run and is never cached or uploaded.
on:
  workflow_dispatch:
    inputs:
      sequences:
        description: "Space-separated EuRoC sequences, each listed in configs/thresholds.yaml"
        type: string
        default: "MH_01_easy"
      runs:
        description: "Runs per sequence (2 shows whether runs agree with each other)"
        type: string
        default: "2"

permissions:
  contents: read

concurrency:
  group: nightly-vio
  cancel-in-progress: false

jobs:
  vio:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SEQS: ${{ inputs.sequences }}
      RUNS: ${{ inputs.runs }}
      IMAGE: vioreg-openvins:v2.7
    steps:
      - name: Host fingerprint (CPU model and SIMD flags)
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          {
            grep -m1 'model name' /proc/cpuinfo
            echo "logical CPUs: $(nproc)"
            echo "SIMD flags: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' \
              | grep -E '^(avx|avx2|avx512.*|fma|sse4.*)$' | sort | tr '\n' ' ')"
          } | tee "$RUNNER_TEMP/host/cpuinfo.txt"

      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          read -ra seq_list <<< "$SEQS"
          for s in "${seq_list[@]}"; do
            [[ "$s" =~ ^(MH|V1|V2)_0[1-5]_[a-z]+$ ]] || { echo "::error::bad sequence name: $s"; exit 1; }
          done
          [ "${#seq_list[@]}" -gt 0 ] || { echo "::error::no sequences given"; exit 1; }
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "::error::runs must be 1..9, got: $RUNS"; exit 1; }

      - name: Save host fingerprint with the results
        run: |
          mkdir -p results
          cp "$RUNNER_TEMP/host/cpuinfo.txt" results/host_ci_cpuinfo.txt
          PYTHONPATH=src python3 -m vioreg.hostinfo --out results/host_ci.json

      - name: Free disk (runner documents a 14 GB SSD; the image build alone peaks near 10 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the harness
        run: pip install -e . pytest

      - name: Build the pinned VIO image
        run: |
          docker build -t "$IMAGE" -f docker/Dockerfile.openvins docker
          docker image inspect "$IMAGE" \
            --format 'image {{.Id}}  ov_ref {{index .Config.Labels "vioreg.ov_ref"}}'
          docker builder prune -af   # drop the build cache before the dataset lands
          df -h /

      - name: Fetch the sequences (range requests; not cached, not uploaded)
        run: |
          avail=$(df --output=avail -B1 / | tail -1)
          if [ "$avail" -lt 5000000000 ]; then
            echo "::error::only $((avail / 1000000)) MB free before fetching; need about 5 GB"
            exit 1
          fi
          read -ra seq_list <<< "$SEQS"
          bash scripts/fetch_euroc.sh data/euroc "${seq_list[@]}"
          df -h /

      - name: Run VIO (serial replay, RUNS per sequence)
        run: |
          read -ra seq_list <<< "$SEQS"
          rc=0
          for s in "${seq_list[@]}"; do
            bash scripts/run_sequence.sh "$s" results || rc=1
          done
          exit $rc

      - name: Score
        if: ${{ !cancelled() }}
        run: |
          read -ra seq_list <<< "$SEQS"
          python -m vioreg.score --seqs "${seq_list[@]}" --out results --image "$IMAGE"

      - name: Gate (fails closed; NEEDS RE-BASELINE and QUALITY FAIL are labelled apart)
        if: ${{ !cancelled() }}
        env:
          HARNESS_RESULTS: results
          HARNESS_REQUIRE_RESULTS: "1"
        run: HARNESS_SEQUENCES="$SEQS" pytest -m sequence -rs --junitxml=junit-gate.xml

      - name: Job summary (verdicts, key, pose reproduction, RPE ratio, host)
        if: always()
        run: |
          read -ra seq_list <<< "$SEQS"
          python -m vioreg.report results --seqs "${seq_list[@]}" --host results/host_ci.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and junit (never the dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vio-results-${{ github.run_id }}
          path: |
            results/
            junit-gate.xml
          if-no-files-found: warn
          retention-days: 14
