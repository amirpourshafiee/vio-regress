name: nightly-vio
# Daily at 11:17 UTC (about 3:17 AM Pacific, off the top of the hour, when GitHub's
# scheduler is busiest), plus manual dispatch. Runs only on main (job-level if), never two at
# once (concurrency). A scheduled run has no inputs, so env falls back to the input defaults.
# GitHub disables schedules in a public repo after 60 days without repository activity;
# re-enable from the Actions tab (docs/ci.md).
# Pulls the published OpenVINS image pinned by registry digest in docker/IMAGE_REF (never
# builds it), then per sequence: fetch, run RUNS times (serial replay), score, delete the bag,
# with df -h at each phase. The gate (src/vioreg/gate.py, docs/gate.md) judges all sequences
# together and fails closed. image_digest is the registry digest, so a run of the pinned image
# has the same baseline key as configs/thresholds.yaml (S5b). The package is public: the pull
# is anonymous and the token stays contents:read; a private package fails the pull.
# The EuRoC dataset is fetched per run and is never cached or uploaded.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      sequences:
        description: "Space-separated EuRoC sequences, each listed in configs/thresholds.yaml"
        type: string
        default: "MH_01_easy V1_01_easy MH_03_medium"
      runs:
        description: "Runs per sequence (2 shows whether runs agree with each other)"
        type: string
        default: "2"
      fault:
        description: "Red-build demo, empty = normal run. One fault applied to a COPY of each bag: blur=9 | gamma=2.2 | drop-frames=2 | time-offset=200 | imu-noise=0.01,0.2"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-vio
  cancel-in-progress: false

jobs:
  vio:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SEQS: ${{ inputs.sequences || 'MH_01_easy V1_01_easy MH_03_medium' }}
      RUNS: ${{ inputs.runs || '2' }}
      FAULT: ${{ inputs.fault }}
    steps:
      - name: Host fingerprint (CPU model and SIMD flags)
        run: |
          mkdir -p "$RUNNER_TEMP/host"
          {
            grep -m1 'model name' /proc/cpuinfo
            echo "logical CPUs: $(nproc)"
            echo "SIMD flags: $(grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' \
              | grep -E '^(avx|avx2|avx512.*|fma|sse4.*)$' | sort | tr '\n' ' ')"
          } | tee "$RUNNER_TEMP/host/cpuinfo.txt"

      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          read -ra seq_list <<< "$SEQS"
          for s in "${seq_list[@]}"; do
            [[ "$s" =~ ^(MH|V1|V2)_0[1-5]_[a-z]+$ ]] || { echo "::error::bad sequence name: $s"; exit 1; }
          done
          [ "${#seq_list[@]}" -gt 0 ] || { echo "::error::no sequences given"; exit 1; }
          [[ "$RUNS" =~ ^[1-9]$ ]] || { echo "::error::runs must be 1..9, got: $RUNS"; exit 1; }
          # fault: empty, or exactly one spec from the allow-list (vioreg.fault_cli.SPEC_PATTERN);
          # value ranges are checked again by fault_cli before anything is written.
          fre='^(imu-noise=[0-9]{1,4}(\.[0-9]{1,4})?,[0-9]{1,4}(\.[0-9]{1,4})?|gamma=[0-9]{1,4}(\.[0-9]{1,4})?|blur=[0-9]{1,4}|drop-frames=[0-9]{1,4}|time-offset=-?[0-9]{1,4}(\.[0-9]{1,4})?)$'
          [[ -z "$FAULT" || "$FAULT" =~ $fre ]] || { echo "::error::fault is not on the allow-list: ${FAULT@Q}"; exit 1; }

      - name: Save host fingerprint with the results
        run: |
          mkdir -p results
          cp "$RUNNER_TEMP/host/cpuinfo.txt" results/host_ci_cpuinfo.txt
          PYTHONPATH=src python3 -m vioreg.hostinfo --out results/host_ci.json

      - name: Free disk (runner documents a 14 GB SSD; the pulled image is about 7.8 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the harness
        run: pip install -e . pytest

      - name: Pull the pinned VIO image (docker/IMAGE_REF; verify its registry digest)
        run: |
          [ "$(wc -l < docker/IMAGE_REF)" -eq 1 ] || { echo "::error::docker/IMAGE_REF must be one line"; exit 1; }
          ref=$(cat docker/IMAGE_REF)
          re='^ghcr\.io/amirpourshafiee/vioreg-openvins@sha256:[0-9a-f]{64}$'
          [[ "$ref" =~ $re ]] || { echo "::error::docker/IMAGE_REF is not ghcr.io/amirpourshafiee/vioreg-openvins@sha256:<64 hex>: $ref"; exit 1; }
          docker pull "$ref"
          docker image inspect "$ref" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -qxF "$ref" || { echo "::error::pulled image does not carry the pinned digest"; exit 1; }
          docker image inspect "$ref" \
            --format 'image {{.Id}}  ov_ref {{index .Config.Labels "vioreg.ov_ref"}}'
          echo "IMAGE=$ref" >> "$GITHUB_ENV"
          df -h /

      - name: Per sequence - fetch, run (serial, RUNS), score, delete the bag
        run: |
          read -ra seq_list <<< "$SEQS"
          rc=0
          bag=""
          fbag=""
          trap 'rm -f "$bag" "$fbag"' EXIT   # never leave a bag behind, whatever fails
          need=5000000000                # one bag plus its fetch temp file
          [ -n "$FAULT" ] && need=8000000000   # plus the faulted copy (red-build demo)
          for s in "${seq_list[@]}"; do
            echo "::group::$s"
            bag="data/euroc/$s/$s.bag"
            echo "df before fetch ($s):"; df -h /
            avail=$(df --output=avail -B1 / | tail -1)
            if [ "$avail" -lt "$need" ]; then
              echo "::error::$s: only $((avail / 1000000)) MB free before fetching; need $((need / 1000000)) MB"
              rc=1
            else
              # Each request retries 429/5xx/timeouts with backoff; --attempts restarts the whole
              # sequence (60 s, then 120 s). The status file lets the gate label the outcome.
              fetch_rc=0
              bash scripts/fetch_euroc.sh data/euroc "$s" --attempts 3 --backoff-s 60 --status-dir results || fetch_rc=$?
              if [ "$fetch_rc" -eq 0 ]; then
                echo "df after fetch ($s):"; df -h /
                data=data/euroc
                if [ -n "$FAULT" ]; then
                  # Red-build demo: replay a faulted COPY; the original bag is mounted read-only.
                  if out=$(python -m vioreg.fault_cli spec "$FAULT" --seq "$s" --print-data-root); then
                    data=${out##*$'\n'}
                    fbag="$data/$s/$s.bag"
                    cp "$data/fault.json" "results/injected_fault_$s.json"
                    echo "df after faulting ($s):"; df -h /
                  else
                    echo "::error::$s: could not create the faulted copy for fault=$FAULT"
                    data=""
                    rc=1
                  fi
                fi
                if [ -n "$data" ]; then
                  DATA="$data" bash scripts/run_sequence.sh "$s" results || rc=1
                fi
                echo "df after run ($s):"; df -h /
              elif [ "$fetch_rc" -eq 75 ]; then
                echo "::error::$s: data fetch failed, not a quality result (server unavailable or rate-limited after retries)"
                rc=1
              else
                echo "::error::$s: data fetch failed, not a quality result (fetch error, exit $fetch_rc)"
                rc=1
              fi
            fi
            # Always score: a sequence that did not run gets a failed result, not a gap.
            python -m vioreg.score --seqs "$s" --out results --image "$IMAGE" || rc=1
            rm -f "$bag" "$fbag"
            echo "df after deleting the bag ($s):"; df -h /
            echo "::endgroup::"
          done
          exit $rc

      - name: Gate (fails closed; NEEDS RE-BASELINE and QUALITY FAIL are labelled apart)
        if: ${{ !cancelled() }}
        env:
          HARNESS_RESULTS: results
          HARNESS_REQUIRE_RESULTS: "1"
        run: HARNESS_SEQUENCES="$SEQS" pytest -m sequence -rs --junitxml=junit-gate.xml

      - name: Job summary (verdicts, key, pose reproduction, RPE ratio, host)
        if: always()
        run: |
          read -ra seq_list <<< "$SEQS"
          python -m vioreg.report results --seqs "${seq_list[@]}" --host results/host_ci.json \
            --injected-fault "$FAULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and junit (never the dataset)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vio-results-${{ github.run_id }}
          path: |
            results/
            junit-gate.xml
          if-no-files-found: warn
          retention-days: 14
