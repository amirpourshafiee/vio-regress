# Gate thresholds, format v2 (session S4). GENERATED by scripts/make_thresholds.py;
# review the diff and commit it. Never loosen a margin to make CI green without a commit
# message that says why. Semantics (src/vioreg/gate.py, docs/gate.md):
#  - a result is compared only with the baseline entry whose (vio_commit, image_digest,
#    config_hash) matches; no matching entry = FAIL "needs re-baseline"
#  - hard fail: ok=false, any failed run, coverage < baseline - coverage_drop_max,
#    ate.n < baseline n - pose_count_drop_max (the allowance covers the recorder losing up
#    to 2 poses at each end of an identical run), missing results when
#    HARNESS_REQUIRE_RESULTS=1
#  - RPE: per sequence, rpe.rmse / baseline rpe_rmse <= rpe_ratio_max
#  - ATE: geometric mean over ALL sequences of ate.rmse / baseline ate_rmse
#    <= ate_geomean_ratio_max (no single-sequence ATE limit)
#  - same key but different poses than baselines/<seq>.tum = WARNING, not a failure
# baseline docs/rebaseline_s5b/baseline.json; S4 margins (docs/gate.md): RPE 1.28 = geometric midpoint of legit per-sequence max 1.145 and known-bad min 1.431 (x1.118 room each side); ATE geomean 1.5 is a backstop only and does NOT separate (legit max 1.286 vs known-bad min 1.306); S5b: S3 baseline re-keyed to the registry digest of docker/IMAGE_REF after pose-equivalent runs (docs/rebaseline_s5b) (2026-11-14)
version: 2
defaults:
  align: posyaw
margins:
  rpe_ratio_max: 1.28
  ate_geomean_ratio_max: 1.5
  coverage_drop_max: 0.01
  pose_count_drop_max: 4
